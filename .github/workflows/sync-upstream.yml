name: Sync upstream NeonPlan

on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream-main
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'Bearstorm/neonplan3d' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Merge upstream safely
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh auth setup-git
          git clone --branch main --single-branch https://github.com/Bearstorm/neonplan3d.git repo
          cd repo
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch https://github.com/Mastershort/neonplan3d.git main
          if ! git merge --no-edit FETCH_HEAD; then
            git merge --abort || true
            echo '::error::Upstream merge conflict; no changes pushed.'
            exit 1
          fi
          git push origin HEAD:refs/heads/main
